const SOAL = [
{id:1, passage:'<div class="passage-title">Platypus<br><small>Soal 1 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Platypus memiliki ciri khas tubuh yang unik. Tubuhnya ditutupi oleh bulu yang lembut dan kedap air, yang melindunginya dari suhu dingin saat berenang di perairan. Paruhnya mirip dengan paruh bebek dan dilengkapi dengan reseptor yang sensitif terhadap perubahan suhu dan gerakan, membantu platypus dalam mencari makanan di dasar sungai atau danau. Kaki berselaputnya memungkinkan platypus untuk berenang dengan cepat dan efisien.</p><p>Platypus adalah hewan pemangsa yang makan berbagai jenis makanan, termasuk serangga, cacing, dan krustasea. Mereka mencari makan dengan cara meraba-raba dasar perairan menggunakan paruh mereka yang sensitif. Platypus memiliki kemampuan untuk menutup mata, telinga, dan hidungnya saat berada di bawah air, sehingga mereka dapat fokus pada pencarian makanan tanpa gangguan.</p><p>Platypus memiliki peranan penting dalam ekosistem tempat tinggalnya. Mereka membantu mengontrol populasi serangga dan krustasea, yang dapat mempengaruhi keseimbangan ekosistem perairan. Selain itu, platypus juga menjadi bagian dari rantai makanan sebagai mangsa bagi predator seperti ular dan burung pemangsa. berada di bawah air, sehingga mereka dapat fokus pada pencarian makanan tanpa gangguan.<br> Sumber: ruangguru.com</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Kata serapan dari bahasa asing yang terdapat pada teks di atas adalah...', opts:['efesien, sensitif, populasi, serangga, rantai makanan','reseptor, sensitive, ekosistem, krustasea, pemangsa','efisien, populasi, krustasea, rantai makanan, fokus','reseptor, efisien, ekosistem, rantai makanan, focus','reseptor, efisien, populasi, ekosistem, predator'], kunci:[4], bahas:'<b>Sesuai kunci web defantri: (E) reseptor, efisien, populasi, ekosistem, predator</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:2, passage:'<div class="passage-title">KPK dan Kuota Haji<br><small>Soal 2 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Saat ini juga, Komisi Pemberantasan Korupsi (KPK) tengah sibuk mengusut dugaan korupsi dalam penentuan kuota dan penyelenggaraan ibadah haji pada Kementerian Agama tahun 2023-2024. Dalam waktun dekat, menurut Pelaksana Tugas Deputi Penindakan dan Eksekusi KPK Asep Guntur Rahayu, KPK akan mengumumkan siapa tersangkanya (KR, Kamis 11/9). Sejunlah barang bukti, antara lain rumah dan kendaraan sudah disita KPK.</p><p>Kita belum tahu apakah mantan Menteri Agama Yaqut Cholil Qoumas akan ditetapkan menjadi tersangka dalam kasus ini atau tidak. Namun berdasar catatan, setidaknya sudah ada dua mantan Menteri Agama yang terjerat kasus korupsi haji, yaitu Suryadharma Ali dalam kasus korupsi penyekenggaraan haji tahun 2011-2013 dan Said Agil Husein Al Munawar yang terjerat kasus korupsi dalam penggunaan dana Abadi Umat dan biaya penyelenggaraan ibadah haji tahun 1999-2003. <br> (Kedaulatan Rakyat, 12 September 2025)</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Berdasarkan kosa kata yang digunakan, objek yang dibicarakan pada teks di atas adalah...', opts:['status seorang mantan menteri yang belum jelas','korupsi di Lembaga Kementrian Agama','menteri yang terjerat kasus korupsi','huru-hara di Kementerian Agama','kesibukan KPK dalam bertugas'], kunci:[1], bahas:'<b>Sesuai kunci web defantri: (B) korupsi di Lembaga Kementrian Agama</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:3, passage:'<div class="passage-title">Banda Neira<br><small>Soal 3 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Banda Neira memiliki lanskap yang menakjubkan dengan pantai berpasir putih, air laut yang jernih, dan terumbu karang yang indah. Pulau ini dikelilingi oleh pegunungan vulkanik yang menawarkan pemandangan spektakuler dan beragam kegiatan luar ruangan seperti snorkeling, menyelam, dan hiking. Salah satu fitur utama pulau ini adalah Gunung Banda Api, sebuah gunung berapi aktif yang sering menjadi objek penelitian dan minat para pendaki.</p><p>Sejarah Banda Neira sangat berhubungan dengan perdagangan rempah-rempah, khususnya pala, yang pada masa lalu menjadi komoditas penting di pasar dunia. Pada abad ke-17, Banda Neira menjadi pusat perdagangan pala yang dikuasai oleh Belanda dan Inggris, menjadikannya salah satu lokasi strategis dalam sejarah kolonialisme di Indonesia. Beberapa bangunan kolonial yang masih berdiri di pulau ini, seperti Benteng Belgica dan beberapa gereja tua, menjadi saksi bisu dari sejarah perdagangan rempah-rempah.</p><p>Banda Neira juga memiliki keanekaragaman hayati yang kaya, baik di darat maupun di laut. Pulau ini menjadi rumah bagi berbagai spesies flora dan fauna, termasuk burung endemik dan ikan karang yang langka. Keberadaan taman laut di sekitar pulau ini memberikan perlindungan kepada ekosistem laut yang vital dan mendukung upaya konservasi untuk menjaga kelestarian lingkungan. <br> Sumber: ruangguru.com</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'bs', tanya:'Berdasarkan teks di atas, pilihlah jawaban Benar atau Salah , informasi yang dapat diperoleh dari teks di atas.<br><small>Tentukan Benar / Salah sesuai isi teks.</small>', labels:['Benar','Salah'], statements:['Banda Neira menjadi rebutan bangsa Belanda dan Inggris.','Yang menjadi daya tarik pulau ini adalah gunung berapi yang banyak.','Banda Neira memiliki keanekaragaman hayati yang kaya baik di darat maupun di laut.','Beberapa bangunan kolonial yang masih berdiri di pulau ini, seperti Benteng Belgica dan beberapa gereja tua.','Banda Neira memiliki lanskap yang menakjubkan dengan pantai berpasir putih, air laut yang jernih, dan terumbu karang yang indah.'], kunci:['Salah','Salah','Benar','Benar','Benar'], bahas:'<b>Sesuai kunci web defantri.</b> Kunci: Salah | Salah | Benar | Benar | Benar.'},
{id:4, passage:'<div class="passage-title">Menkeu Purbaya dan Ekonomi Riil<br><small>Soal 4 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Untuk menggerakkan ekonomi lewat sektor riil, Menteri Keuangan (Menkeu) baru Purbaya Yudhi Sadewa melakukan pemindahan dana pemerintah di Bank Indonesia (BI) ke bank-bank BUMN sebesar Rp200 triliun. Pemindahan dana tersebut untuk mendorong penyaluran kredit bagi program prioritas, termasuk Kopdes Merah Putih (KMP) dan tidak boleh digunakan untuk membeli instrument investasi seperti Surat Berharga Negara (SBN) dan Sekuritas Rupiah Bank Indonesia (SRBI).</p><p>Tantangan ekonomi saat ini sebenarnya bukan hanya dari ketersediaan likuiditas saja, tetapi juga masih lemahnya permintaan kredit serta investasi. Survei BI menginfokan Indeks Keyakinan Konsumen (IKK) bulan Agustus 2025 berada pada level optimis 117,2 namun melemah dari bulan sebelumnya 118,1. Sedangkan indeks Ketersediaan Lapangan Kerja (IKLK) berada di level pesimis sebesar 93.2. Hal ini tentu merupakan tantangan yang tidak ringan bagi bank-bank BUMN dalam menyalurkan kredit agar tepat sasaran. Disisi lain, kucuran likuiditas ini tidak gratis, karena mereka harus membayar bunga kepada pemerintah, meski jauh di bawah bunga pasar.</p><p>Ditilik dari polanya, kebijakan ini tidak jauh berbeda dengan pengucuran dana Kredit Likuiditas BI (KLBI) kepada perbankan pada era transisi pasca reformasi 1997/98, hanya sumber dananya saja yang berbeda, namun implikasi ke sektor moneternya sama yakni menambah jumlah uang beredar. Sedangkan efektivitas dampak ke sektor riilnya masih perlu diuji.<br> Sumber: krjogja.com</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Fakta utama dari teks berita di atas adalah...', opts:['Indeks Ketersediaan Lapangan Kerja (IKLK) berada di level pesimis sebesar 93.2.','Indeks Keyakinan Konsumen (IKK) bulan Agustus 2025 berada pada level optimis 117,2 namun melemah dari bulan sebelumnya 118,1.','Kucuran likuiditas yang diberikan tidak gratis, karena mereka harus membayar bunga kepada pemerintah, meski jauh di bawah bunga pasar.','Menteri Keuangan melakukan pemindahan dana pemerintah di Bank Indonesia (BI) ke bank-bank BUMN untuk mendorong penyaluran kredit bagi program prioritas.','Kebijakan ini tidak jauh berbeda dengan pengucuran dana Kredit Likuiditas BI (KLBI) kepada perbankan pada era transisi pasca reformasi 1997/98, hanya sumber dananya saja yang berbeda.'], kunci:[3], bahas:'<b>Sesuai kunci web defantri: (D) Menteri Keuangan melakukan pemindahan dana pemerintah di Bank Indonesia (BI) ke bank-bank BUMN untuk mendorong penyaluran kredit bagi program prioritas.</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:5, passage:'<div class="passage-title">Talas Pangan Tradisional<br><small>Soal 5 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Talas sebagai sumber pangan tradisional harus dilestarikan dan dikembangkan agar tetap dikenal oleh generasi mendatang. Talas kaya akan karbohidrat dan serat, serta dapat diolah menjadi berbagai jenis makanan tradisional yang lezat. Tidak hanya sebagai makanan pokok, talas juga dapat dijadikan olahan dessert, seperti cake atau bolu, keripik, hingga es krim. Upaya pelestarian dan pengembangan talas harus dilakukan agar generasi muda tetap mengenal dan menghargai makanan tradisional ini. Sumber: ruangguru.com <br> Sumber: ruangguru.com</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Kerangka sederhana yang tepat untuk teks di atas adalah...', opts:['','','','',''], kunci:[0], bahas:'<b>Sesuai kunci web defantri: (A) </b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:6, passage:'<div class="passage-title">Petir dan Pelangi (Teks Ganda)<br><small>Soal 6 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Teks 1 Petir terjadi akibat adanya perbedaan muatan yang ada di awan. Muatan di awan ini bergerak secara terus menerus dan teratur, sehingga selama proses bergerak ini, muatan berinteraksi satu sama lain dengan muatan pada awan lain.</p><p>Interaksi ini menjadikan muatan negatif berkumpul di satu sisi saja, semisal di bagian atas atau di bagian bawah Adapun muatan positif juga berkumpul di satu sisi, tepatnya di sisi sebaliknya dari muatan negatif.</p><p>Hal ini berarti terjadi perbedaan potensial yang ada pada awan dan bumi. Jika perbedaan muatan potensial cukup besar, pembuangan muatan negatif (elektron) pun akan berlangsung dari awan ke bumi atau sebaliknya agar tercapai kesetimbangan. Ketika proses pembuangan muatan inilah, terjadi ledakan suara yang diiringi dengan nampaknya kilatan cahaya amat terang.</p><p>Petir lebih sering muncul ketika musim hujan karena aliran udara yang lebih besar akibat ada kadar air yang terdapat di dalam udara relatif lebih tinggi.<br> Sumber: ruangguru.com</p><p>Pelangi adalah peristiwa optik dan meteorologi yang terjadi karena terdapatnya kumpulan cahaya warna-warni paralel satu dengan yang lainnya yang muncul di langit atau di media lainnya. Di langit, pelangi terlihat seperti busur cahaya yang mengarah ke cakrawala ketika hujan ringan. Selain itu pelangi juga bisa dilihat di sekeliling air terjun.</p><p>Terdapat empat siklus yang dapat membentuk pelangi. Pertama, pembiasan sinar matahari. Pelangi terbentuk karena terdapat pembiasan sinar cahaya matahari yang dibelokkan ketika sedang menuju satu medium ke medium lainnya oleh tetesan air yang terdapat pada atmosfer. Kedua, sinar matahari melewati tetesan air. Ketika cahaya matahari melalui tetesan air, cahaya matahari tersebut akan dibelokkan dan membuat warna-warna tadi berpisah dengan sendirinya. Ketiga, pembelokkan cahaya. Setiap warna-warna pelangi akan dibelokkan pada sudut yang tidak sama, sehingga membuat warna pelangi menjadi semakin indah. Keempat, terbentuklah warna pelangi. Warna yang dibelokkan pertama kali adalah warna ungu, sedangkan untuk warna terakhir yang dibelokkan adalah warna merah. Warna pelangi terlihat utuh disebabkan oleh geometri optik dalam proses penguraian warna.</p><p>Pelangi cuma bisa kita jumpai ketika hujan, berbarengan dengan matahari bersinar, namun dari sisi yang berlawanan dengan kita. Kita harus berada di antara matahari dan tetesan air dengan matahari berada di belakang kita. Maka kita dan pusat busur pelangi harus berada di satu garis lurus.<br> Sumber: ruangguru.com</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Persamaan dan perbedaan dari kedua teks di atas adalah...', opts:['Kedua teks membicarakan efek turunnya hujan. Perbedaannya teks 1 membicarakan petir, teks 2 membicarakan Pelangi.','Kedua teks membahas tentang hujan. Perbedaannya teks 1 membicarakan waktu munculnya petir, teks 2 membicarakan sisi penampakan Pelangi.','Kedua teks membahas tentang aliran listrik yang muncul akibat terjadi hujan. Teks 1 membicarakan segi negatifnya, teks 2 membicarakan segi positifnya.','Kedua teks membahas tentang aliran listrik yang terjadi karena hujan. Teks 1 membicarakan aliran listrik yang menjadi petir, teks 2 membicarakan aliran listrik yang menjadi pelangi','Kedua teks membahas tentang fenomena alam yang terjadi ketika ada hujan. Perbedaannya teks 1 membahas tentang muatan dalam awan, teks 2 membahas pembiasan sinar matahari.'], kunci:[4], bahas:'<b>Sesuai kunci web defantri: (E) Kedua teks membahas tentang fenomena alam yang terjadi ketika ada hujan. Perbedaannya teks 1 membahas tentang muatan dalam awan, teks 2 membahas pembiasan sinar matahari.</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:7, passage:'<div class="passage-title">Masa Remaja<br><small>Soal 7 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Masa remaja merupakan masa sulit karena butuh pengendalian diri yang lebih daripada saat masa anak-anak. Dalam masa ini remaja butuh orang dewasa untuk mengarahkan ke perilaku positif agar tidak terpengaruh ke perbuatan negatif. Jika pengendaliannya baik, remaja bisa menjadi anak yang membanggakan orang tuanya. Pendidikan karakter ini dapat membentuk remaja menjadi berprestasi.</p><p>Di dalam pendidikan karakter mereka juga diajarkan nilai religius yang dapat menguraikan kebaikan agar remaja tumbuh sebagai manusia yang peka pada lingkungan sosial.</p><p>Di samping itu mereka juga diajarkan nilai toleransi dan cinta damai atau nilai-nilai kemanusiaan agar membentuk remaja yang mempunyai sifat pengasih. Dengan demikian, nilai-nilai positif dalam pendidikan karakter itu dapat membentuk remaja yang unggul. Mereka juga dapat bersaing dengan baik di tingkat nasional maupun internasional.</p><p>Dengan begitu, remaja yang memiliki karakter kuat. Nilai positif dalam pendidikan karakter juga dapat membuat kegiatan remaja terarah dan akan mempunyai budi pekerti yang baik. <br> Sumber: detik.com</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'bs', tanya:'Tentukan apakah setiap pernyataan berikut Benar atau Salah sesuai dengan kutipan teks!<br><small>Tentukan Benar / Salah sesuai isi teks.</small>', labels:['Benar','Salah'], statements:['Pendidikan karakter mengajarkan nilai religus saja.','Masa remaja butuh pengendalian diri yang lebih dibandingkan masa anak-anak.','Remaja perlu belajar nilai toleransi dan cinta damai atau nilai-nilai kemanusiaan agar mempunyai sifat pengasih.'], kunci:['Salah','Benar','Benar'], bahas:'<b>Sesuai kunci web defantri.</b> Kunci: Salah | Benar | Benar.'},
{id:8, passage:'<div class="passage-title">Demonstrasi<br><small>Soal 8 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Akhir-akhir ini demonstrasi kerap terjadi hampir setiap waktu dan terjadi di berbagai tempat. Bahkan, demonstrasi sudah menjadi fenomena yang lumrah di tengahtengah masyarakat kita. Menanggapi fenomena tersebut, seorang kepala daerah menyatakan bahwa penyebab demonstrasi dan anarkisme tidak lain adalah faktor laparnya masyarakat. Lantas ia mencontohkan rakyat Malaysia dan Brunei yang adem ayem, lantaran kesejahteraan mereka terpenuhi maka demonstrasi di negara-negara itu jarang terjadi.</p><p>Tentu saja komentar tersebut menyulut reaksi para mahasiswa. Mereka memprotes dan meminta sang bupati mencabut kembali pernyataannya. Para mahasiswa tidak terima dan tidak merasa memiliki motif serendah itu. Mereka berpendirian bahwa demonstrasi yang biasa mereka lakukan murni untuk memperjuangkan kebenaran dan melawan kemungkaran yang terjadi di hadapan mereka.</p><p>Demonstrasi massa tidak selalu disebabkan oleh urusan perut, bahkan banyak peristiwa yang sama sekali tidak didasari oleh motif itu. Dalam kaitannya dengan kebutuhan manusia, Abraham Maslow membaginya ke dalam beberapa tingkatan. Kebutuhan yang paling mendasar adalah makan dan minum. Sementara itu, yang paling puncak adalah kebutuhan akan aktualisasi diri.</p><p>Namun demikian, pada umumnya demonstrasi massa justru lebih didasari oleh kebutuhan tingkatan akhir itu. Masyarakat berdemonstrasi karena membutuhkan pengakuan dari pemerintah ataupun pihak-pihak lain agar hak-hak dan eksistensi mereka diakui. Karena merasa dibiarkan, hak-haknya diingkari, bahkan dinistakan, kemudian mereka berusaha untuk menunjukkan jati dirinya dengan cara berdemonstrasi.</p><p>Banyak fakta dapat membuktikannya. Demonstrasi massa pada awal reformasi di negeri ini pada tahun 1997–1998, bukan dilakukan oleh rakyat miskin ataupun orangorang lapar. Justru hal itu dilakukan oleh warga dari kalangan menengah ke atas, dalam hal ini adalah mahasiswa dan golongan intelektual. Belum lagi jika merujuk pada kasuskasus yang terjadi di luar negeri. Dalam beragam skala (besar atau kecil), demonstrasi bukan hal aneh lagi bagi negara-negara Eropa. Demonstrasi yang mereka lakukan sudah tentu tidak didorong oleh kondisi perut yang lapar karena mereka pada umumnya dalam kondisi yang sangat makmur. <br> Sumber: ruangguru.com</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Pernyataan yang benar sesuai dengan isi kedua paragraf pada teks di atas adalah...', opts:['Paragraf pertama menjelaskan proses terjadinya paragraf kedua, sedangkan paragraf ketiga, keempat dan kelima merupakan argument untuk memperkuat paragraf kedua.','Paragraf pertama merupakan penyebab paragraf kedua, sedangkan paragraf ketiga, keempat dan kelima merupakan argumen untuk memperkuat paragraf kedua.','Paragraf kedua menjelaskan akibat paragraf pertama sedangkan paragraf ketiga, keempat, dan kelima merupakan argumen untuk memperkuat paragraf pertama,','Paragraf kedua menjelaskan tujuan paragraf pertama, sedangkan paragraf ketiga, keempat dan kelima merupakan argumen untuk memperkuat paragraf pertama','Paragraf pertama merupakan akibat paragraf kedua, sedangkan paragraf ketiga, keempat, merupakan argumen pendukung paragraf kedua.'], kunci:[1], bahas:'<b>Sesuai kunci web defantri: (B) Paragraf pertama merupakan penyebab paragraf kedua, sedangkan paragraf ketiga, keempat dan kelima merupakan argumen untuk memperkuat paragraf kedua.</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:9, passage:'<div class="passage-title">Sultan HB X dan Demo<br><small>Soal 9 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Kunjungan Sultan HB X menemui massa demo di Polda DIY, menciptakan narasi media dan opini publik secara positif. Media lokal maupun nasional bahkan internasional, menggambarkan tindakan Sultan sebagai langkah bijaksana , menenangkan dan meredakan ketegangan.</p><p>Narasi yang dibangun media fokus pada peran Sultan sebagai tokoh yang mampu menjembatani antara pemerintah dan masyarakat. Sekaligus menunjukkan kepedulian terhadap aspirasi rakyat.</p><p>Opini publik cenderung mengapresiasi sikap Sultan yang turun langsung ke lapangan, berbeda dengan pejabat lain yang dianggap kurang responsif. Kunjungan Sultan dianggap meningkatkan kepercayaan masyarakat, memberikan harapan akan dialog yang lebih konstruktif, dan membuka ruang mediasi yang damai. Media sosial dan berbagai platform berita memberitakan momen ini sebagai simbol kepemimpinan yang merakyat dan responsif terhadap kritikan publik.</p><p>Maka kunjungan Sultan berhasil membentuk narasi positif yang tidak hanya meredam suasana jadi adem. Namun juga memperkuat citra kepemimpinan yang bijak dan empati di tengah krisis sosial-politik, yang pada akhirnya memperbaiki opini publik terhadap pemerintah daerah di DIY.</p><p>Mengapa itu menjadi penting? Sebab akar permasalahan saat ini adalah defisit empati, transparansi, dan komunikasi publik yang efektif serta sikap yang kurang merangkul rakyat sebagai mitra dialog. Untuk memperbaiki komunikasi ini, DPR dan para pejabat negara memang harus meningkatkan transparansi, membangun dialog yang konstruktif dengan rakyat. Mereka musti menunjukkan empati dan kepekaan sosial terhadap kondisi masyarakat. <br> Sumber: krjogja.com</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'bs', tanya:'Berdasarkan isi teks di atas, tentukan apakah setiap hal yang paling Mungkin atau Tidak Mungkin akan terjadi jika Sultan tidak menemui demonstran.<br><small>Tentukan Mungkin / Tidak Mungkin sesuai isi teks.</small>', labels:['Mungkin','Tidak Mungkin'], statements:['Sultan akan dianggap sama dengan pejabat lain yang tidak punya rasa empati.','Suasana akan semakin panas dan akan terjadi chaos.','Media tidak berani membuat narasi negatif karena Sultan adalah Raja Yogyakarta.','Tidak akan menjadi masalah bagi Sultan karena Sultan tidak dipilih oleh rakyat.','Sultan dianggap sebagai tokoh yang tidak mampu menjembatani antara pemerintah dan masyarakat.'], kunci:['Mungkin','Mungkin','Tidak Mungkin','Tidak Mungkin','Mungkin'], bahas:'<b>Sesuai kunci web defantri.</b> Kunci: Mungkin | Mungkin | Tidak Mungkin | Tidak Mungkin | Mungkin.'},
{id:10, passage:'<div class="passage-title">Dunia Digital<br><small>Soal 10 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Dunia digital membawa berbagai informasi dari seluruh belahan dunia yang dapat di akses secara mudah dan instan. Informasi yang dibawa dapat membawa banyak pemikiran, opini, sikap, maupun kebiasaan baru yang timbul hingga membawa arus globalisasi pada negara ini.</p><p>Tentu hal ini akan menimbulkan dampak yang besar bagi negara yang menerapkan Pancasila sebagai ideologi bangsa.</p><p>Perkembangan teknologi secara besar-besaran kini menjadi tantangan bagi nasionalisme bangsa ini, apabila masyarakat tidak dibekali dengan fondasi ideologi yang kuat akan sangat rentan bagi masyarakat untuk terpengaruh budaya dan kebiasaan baru yang tidak selaras dengan nilai budaya yang tertanam dalam nilai-nilai Pancasila.</p><p>Lantas bagaimana mahasiswa dapat mengambil sikap mengenai masuknya berbagai informasi hingga maraknya globalisasi yang kini menjadi tantangan yang mengancam ideologi Pancasila di negara ini?</p><p>Implementasi yang dapat dilakukan oleh mahasiswa dapat berupa pelestarian budaya dan memperkenalkannya pada taraf nasional melalui karya-karya yang dapat tercipta. Pancasila bukan membatasi untuk berkembang dalam kemajuan teknologi, tapi justru dapat digunakan sebagai tameng dan benteng batasan agar tidak terpengaruh terlalu jauh oleh budaya luar yang tidak mencerminkan nilai-nilai pancasila.</p><p>Sebagai ideologi terbuka dirancang untuk dapat fleksibel dan adaptif mengenai perkembangan zaman dan kebutuhan masyarakat. Adanya perubahan dan transformasi mengenai perkembangan teknologi dan penyebaran informasi, pancasila sangat fleksibel dalam implementasi sesuai konteks yang selaras dengan kebutuhan zaman.</p><p>Saat ini budaya kian tergerus dan perlahan terkikis lalu mulai ditinggalkan. Sebagai mahasiswa yang akan menjadi penerus generasi bangsa, sangat perlu untuk ikut serta melestarikan dan memperkenalkan budaya-budaya yang ada di Indonesia. <br> Sumber: krjogja.com</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'bs', tanya:'Tentukan apakah setiap pernyataan berikut Benar atau Salah , solusi sederhana yang mungkin ditempuh untuk mengatasi permasalahan pada teks di atas.<br><small>Tentukan Benar / Salah sesuai isi teks.</small>', labels:['Benar','Salah'], statements:['melarang segala pertunjukan yang tidak berbau kesenian daerah.','sering mengadakan berbagai lomba kesenian daerah.','pemberian subsidi pada sanggar-sanggar budaya.','menciptakan akulturasi kebudayaan.','mengadakan pertunjukan kesenian daerah pada hari besar nasional.'], kunci:['Salah','Benar','Benar','Salah','Benar'], bahas:'<b>Sesuai kunci web defantri.</b> Kunci: Salah | Benar | Benar | Salah | Benar.'},
{id:11, passage:'<div class="passage-title">Biografi Ahmadun Yosi Herfanda<br><small>Soal 11 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Ahmadun Yosi Herfanda lahir di Kaliwungu, Kabupaten Kendal, Jawa Tengah, 17 Januari 1958. Ahmadun telah aktif sebagai editor dan jurnalis sejak menjadi mahasiswa Dimulai dari Harian Kedaulatan Rakyat Yogyakarta (1983-1999), lalu di Harian Yogya Post (1999-1992), Majalah Sarinah (bersama Korrie Layun Rampan, 1992-1993), dan terakhir di Harian Republika Jakarta (1993-2010).</p><p>Di harian Republika ia menjabat sebagai Redaktur Sastra, Koordinator Desk Opini dan Budaya, dan Asisten Redaktur Pelaksana. Karier strukturalnya tidak begitu ia perhatikan, karena kesibukannya dalam menulis karya kreatif, mengelola acara-acara sastra, dan menjadi nara sumber berbagai workshop penulisan. Ia juga mengajar di sejumlah perguruan tinggi, mengisi diskusi, pentas baca puisi, serta seminar sastra di berbagai kota di tanah air dan mancanegara.</p><p>Dalam perjalanan karier terakhirnya (di Republika), aktivitas sastra lebih banyak menyedot kecintaannya daripada kerja jurnalistik. Sejak Maret 2010 Ahmadun aktif sebagai Ketua Komite Sastra Dewan Kesenian Jakarta (DKJ) untuk periode 2010-2013.Ini adalah untuk kedua kalinya ia menjadi anggota DKJ.</p><p>Sebagai sastrawan (penyair), ia sering diundang untuk membacakan sajak-sajaknya maupun menjadi pembicara dalam berbagai pertemuan sastrawan serta diskusi dan seminar sastra nasional maupun internasional.</p><p>Adapun seminar tersebut antara lain di Seoul dan Ansan (Korea Selatan), Kairo Mesir, Thailand, Singapura, Malaysia, Turkey, dan Brunei Darussalam, serta berbagai kota di Indonesia.</p><p>Setelah menyelesaikan di Fakultas Pendidikan Bahasa dan Seni (FPBS) IKIP Yogyakarta, ia melanjutkan pendidikan jenjang S-2 jurusan Teknologi Informasi pada Universitas Paramadina, Jakarta, 2005.</p><p>Ia pernah menjadi Ketua III Himpunan Sarjana Kesastraan Indonesia (HISKI, 1993-1995), dan ketua Presidium Komunitas Sastra Indonesia (KSI, 1999-2002). Tahun 2003, bersama cerpenis Hudan Hidayat dan Maman S. Mahayana, ia mendirikan Creative Writing Institute (CWI).</p><p>Tahun 2007 terpilih sebagai Ketua Umum Komunitas Cerpen Indonesia (KCI, 2007-2010).</p><p>Tahun 2008 terpilih sebagai Ketua Umum Komunitas Sastra Indonesia (KSI). Ahmadun juga pernah menjadi anggota Dewan Penasihat dan anggota Mejelis Penulis Forum Lingkar Pena (FLP). Tahun 2010, bersama sejumlah sastrawan Jakarta, mendirikan Yayasan Sastra Indonesia—Yayasan Cinta Sastra—dan diamanati menjadi ketuanya.<br> Sumber: sastrawacana.id</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Relevansi kutipan teks biografi di atas dengan kehidupan sehari-hari adalah...', opts:['Orang tidak bisa hidup hanya dengan profesi sebagai penyair.','Orang mengutamakan pekerjaan yang sesuai dengan hobinya.','Sastra menjadikan seseorang terkenal sampai ke mancanegara.','Penyuka sastra akan mempunyai karier yang melejit di dalam bidang sastra.','Penyair adalah profesi yang diidamkan banyak orang karena bisa mengangkat derajat hidup.'], kunci:[1], bahas:'<b>Sesuai kunci web defantri: (B) Orang mengutamakan pekerjaan yang sesuai dengan hobinya.</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:12, passage:'<div class="passage-title">Tere Liye<br><small>Soal 12 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Darwis atau yang lebih kita kenal sebagai \'Tere Liye\' dilahirkan di sebuah kota kecil di Provinsi Sumatera Selatan, tepatnya yaitu Kota Lahat pada tanggal 21 Mei 1979. Darwis bukanlah seorang anak yang lahir dari sebuah keluarga kaya raya. Orang tuanya sehari-hari memiliki mata pencaharian sebagai petani dengan dikaruniai banyak anak. Dia diketahui merupakan anak keenam dari tujuh bersaudara. Meskipun begitu, orang tua Tere Liye mendidik dan membesarkan anaknya sehingga tumbuh sebagai pribadi yang pintar dan cerdas.</p><p>Tere Liye banyak menghabiskan masa kecilnya di kampung halamannya. Semasa menginjak usia masuk sekolah, Tere Liye mengenyam pendidikan dasar di Sekolah Dasar Negeri 2 Kikim Timur, Kecamatan Kikim Timur. Kemudian, Tere Liye melanjutkan ke jenjang pendidikan tingkat menengah di SMP Negeri 2 Kikim yang juga terletak di wilayah Kabupaten Lahat. Setelah mulai menginjak usia Sekolah Menengah Atas, Tere Liye mulai keluar dari kampung halamannya untuk meneruskan pendidikannya di SMA Negeri 9 Bandar Lampung, Provinsi Lampung.</p><p>Kehidupannya di Bandar Lampung telah membuat sosok Tere Liye menjadi seorang yang haus akan ilmu. Selanjutnya, Tere Liye memutuskan untuk melanjutkan pendidikan ke jenjang lebih tinggi lagi. Dia ingin mengenyam pendidikan tinggi terbaik yang di Indonesia. Maksud dari keinginannya tersebut adalah kuliah di Universitas Indonesia atau disingkat UI.</p><p>Pada akhirnya, Tere Liye berhasil mewujudkan mimpinya tersebut. Tere Liye secara resmi diterima sebagai mahasiswa baru di Universitas Indonesia (UI). Sebagai seorang penulis novel yang erat kaitannya dengan program studi sastra, ternyata banyak orang yang tidak mengetahui bahwa Tere Liye merupakan mahasiswa dari Jurusan Akuntansi di Fakultas Ekonomi UI.</p><p>Setelah menyelesaikan kuliahnya, Tere Liye ternyata tidak bekerja di sebuah perusahaan yang memiliki keterkaitan dengan dunia sastra atau kepenulisan. Tere Liye awalnya bekerja sebagai seorang akuntan di sebuah perusahaan. Hal ini pun sesuai dengan latar belakang pendidikannya yaitu akuntansi. <br> Sumber: gramedia.com</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'bs', tanya:'Berdasarkan teks di atas, tentukan apakah setiap dampak berikut, yang Mungkin atau Tidak Mungkin terjadi pada seorang yang ingin menjadi penulis..<br><small>Tentukan Mungkin / Tidak Mungkin sesuai isi teks.</small>', labels:['Mungkin','Tidak Mungkin'], statements:['Penulis pemula akan bersemangat menulis karena pasti menjadi orang yang sukses.','Orang tidak akan ragu untuk memulai menulis karena ada fakta bahwa penulis tidak harus berpendidikan sastra.','Orang miskin yang punya keinginan menulis akan mulai menulis karena penulis tidak harus berasal dari keluarga kaya.','Orang akan menulis sejak keinginan menulis muncul karena untuk menjadi penulis tidak perlu menunggu selesai kuliah.','Orang akan ragu untuk menulis karena ternyata untuk menjadi penulis membutuhkan waktu berproses yang lama.'], kunci:['Tidak Mungkin','Mungkin','Mungkin','Mungkin','Tidak Mungkin'], bahas:'<b>Sesuai kunci web defantri.</b> Kunci: Tidak Mungkin | Mungkin | Mungkin | Mungkin | Tidak Mungkin.'},
{id:13, passage:'<div class="passage-title">Kompos Limbah Rumah Tangga<br><small>Soal 13 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Cara Mengolah Limbah Rumah Tangga Menjadi Kompos</p><p>- Gunakan pisau untuk mencacah sampah organik rumah tangga hingga berukuran kecil. Semakin kecil ukuran, semakin mudah sampah mengurai dan menjadi kompos.<br>- Campur dengan serbuk gergaji (bisa menggunakan tanah atau pupuk kandang sebagai pengganti).<br>- Larutkan EM4 dengan air. Penggunaan EM4, kira-kira 200 ml (20 sendok makan) per 10 kg sampah organik.<br>- Tuangkan larutan EM4 perlahan ke bahan kompos. Lalu aduk merata. Masukkan dalam wadah bekas cat atau wadah bekas lainnya yang dapat digunakan untuk pengomposan.<br>- Tutup rapat. Aduk seminggu sekali agar ada pergantian aliran udara dalam wadah.<br>- Selama proses pengomposan, suhu dalam wadah akan naik. Bila kita memegang wadah akan terasa panas. Itu tanda bahwa mikroorganisme sedang bekerja.<br>- Pada minggu ketujuh sampai kedelapan pengomposan selesai. Suhu dalam wadah normal kembali.<br>- Kompos siap digunakan. Kompos yang baik berwarna coklat kehitaman, berbau tanah, dan berbutir halus.<br>- Taruh kompos pada tanaman agar semakin subur.</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'bs', tanya:'Tentukan apakah setiap pernyataan berikut Benar atau Salah sesuai dengan kutipan teks!.<br><small>Tentukan Benar / Salah sesuai isi teks.</small>', labels:['Benar','Salah'], statements:['Semakin kecil ukuran potongan sampah, semakin mudah sampah terurai dan menjadi kompos.','Penggunaan EM4 yang benar adalah 10 sendok makan untuk 10 kg sampah.','Tanda bahwa mikroorganisme bekerja adalah naiknya suhu dalam wadah sehinga dipegang wadah akan terasa panas.'], kunci:['Benar','Salah','Benar'], bahas:'<b>Sesuai kunci web defantri.</b> Kunci: Benar | Salah | Benar.'},
{id:14, passage:'<div class="passage-title">Pembelajaran Sastra<br><small>Soal 14 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Ada baiknya pembelajaran sastra lebih ditekankan lagi untuk generasi muda saat ini. Hal itu untuk mengajarkan anak menghargai setiap karya yang dihasilkan oleh orang lain. Pembelajaran sastra dapat membantu anak dalam mengekspresikan apapun yang anak rasakan. Biasakan anak melihat fenomena dalam masyarakat dengan sudut pandang yang berbeda. Selain itu, pembelajaran sastra juga dapat membantu anak dalam menambah kosa kata. Tidak hanya itu, dengan pembelajaran sastra kita juga dapat mengenalkan anak tentang pilihan kata atau diksi untuk mengungkapkan maksud dari perkataan kita. Diksi membantu anak dalam memilih kata yang tepat agar masih dalam kondisi sopan dan santun.</p><p>Jika porsi sastra dalam kurikulum lebih banyak, guru akan terbantu dalam mengasah anak. Guru lebih mudah untuk membimbing anak dalam pemilihan kata dan cara menghargai karya orang lain. Sehingga, karya-karya dari semua pengarang akan berguna, tetap dikenang, dan yang pasti dikenal oleh seluruh generasi muda saat ini. Dengan demikian, generasi yang santun dan saling menghargai pun akan dimiliki oleh Indonesia dengan cara yang sederhana. Cara sederhana tersebut adalah menyelipkan pelajaran sastra dalam kurikulum dan dalam pelajaran Bahasa Indonesia di semua tingkatan mulai dari tingkat SD sampai dengan SMA. <br> Sumber: bahasaindonesiaw.blogspot.com dengan penyesuaian</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Kalimat yang tidak mendukung gagasan utama pada teks di atas adalah...', opts:['kalimat keempat pada paragraf pertama','kalimat ketujuh dalam paragraf pertama','kalimat keempat pada paragraf kedua','kalimat kelima pada paragraf kedua','kalimat pertama paragraf kedua'], kunci:[0], bahas:'<b>Sesuai kunci web defantri: (A) kalimat keempat pada paragraf pertama</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:15, passage:'<div class="passage-title">Kesehatan Gigi<br><small>Soal 15 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Sejak kecil kita sudah diajari oleh orang tua kita dan guru di sekolah, bahwa menjaga kesehatan gigi merupakan hal yang penting. Sebetulnya, menjaga kesehatan gigi tidak sulit asal kita bisa disiplin dan rutin untuk merawatnya. Langkah sederhana yang bisa kita lakukan adalah dengan menggosok gigi kita dua hingga tiga kali sehari.</p><p>Hal ini pasti bukan hal yang asing untuk dilakukan bukan? Namun, kadang kita sering lupa untuk melakukannya atau malas, dan karena hal itulah yang bisa merusak gigi kita. Waktu yang baik untuk sikat gigi adalah pada saat pagi hari saat bangun tidur, siang hari, dan malam hari sebelum tidur.</p><p>Memilih sikat gigi yang pas juga penting karena sikat gigi yang nyaman akan membuat kita tidak malas untuk melakukannya. Setiap orang memiliki struktur mulut dan gigi yang berbeda-beda, sehingga jenis sikat gigi yang dibutuhkan juga berbeda. Pasta gigi juga harus dipilih yang dirasa tepat untuk gigi anda. Anda bisa meminta saran dokter untuk memilih pasta gigi yang cocok untuk kondisi gigi anda.</p><p>Lalu langkah selanjutnya yang bisa anda lakukan adalah memeriksa gigi anda setiap enam bulan sekali ke dokter gigi. Manfaat anda memeriksakan gigi ke dokter adalah untuk membersihkan karang gigi yang tidak bisa dibersihkan dengan sikat gigi. Sekarang sudah tersedia fasilitas kesehatan gigi yang tidak dipungut biaya, sehingga biaya dokter yang biasanya mematok harga yang mahal tidak perlu dikhawatirkan lagi. <br> Sumber: detik.com</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Penggunaan kalimat tidak efektif pada teks di atas terdapat pada...', opts:['kalimat kedua paragraf kedua','kalimat kedua paragraf ketiga','kalimat ketiga paragraf pertama','kalimat keempat paragraf ketiga','kalimat kedua paragraf keempat'], kunci:[0], bahas:'<b>Sesuai kunci web defantri: (A) kalimat kedua paragraf kedua</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:16, passage:'<div class="passage-title">Puisi Kuhentikan Hujan<br><small>Soal 16 — full teks dari web</small></div><p>Bacalah puisi berikut dengan saksama!</p><p>Kuhentikan hujan<br> Kini matahari merindukanku, mengangkat kabut pagi perlahan<br> Ada yang berdenyut dalam diriku<br> Menembus tanah basah<br> Dendam yang dihamilkan hujan<br> Dan cahaya matahari<br> Tak bisa kutolak<br> Matahari memaksaku menciptakan bunga-bunga</p><p>Kuhentikan Hujan <br> (Sapardi Djoko Damono)</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Kalimat yang mengandung makna konotatif dalam puisi di atas adalah...', opts:['Kuhentikan hujan.','Tak bisa kutolak.','Menembus tanah basah.','Dendam yang hamilkan hujan.','Ada yang berdenyut dalam diriku.'], kunci:[3], bahas:'<b>Sesuai kunci web defantri: (D) Dendam yang hamilkan hujan.</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:17, passage:'<div class="passage-title">Tokoh Candung<br><small>Soal 17 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>(1)Melihat tubuh ringkihnya terkulai letai di atas dipan usang tanpa selimut, barangkali tak akan habis baju sehelai, ia sudah mengembuskan napas penghabisan. (2) Rimba persilatan tentu berkabung sebab kehilangan pendekar paling licin yang pernah ada di Kampung Lekung. (3) Mungkin sudah tiba saatnya, lelaki yang seluruh bagian tubuhnya tahan bacok dan tak mempan peluru itu mewariskan ilmu silat tua, lebih-lebih mewariskan Rantai Celeng yang telah tertanam selama bertahun-tahun di dalam daging paha sebelah kirinya. (4) Sebelum terlambat, sebelum mayatnya dibenam ke liang lahat, sebaiknya Kurai segera menentukan siapa yang pantas menjawab hak waris barang keramat itu.</p><p>(5) "Harganya lebih mahal dari harga diri Kurai sendiri," begitu luapan kekesalan seorang cukong barang antik yang datang ke Kampung Lekung tapi ditolak mentahmentah oleh Kurai.</p><p>(6) "Bujuk tua bangka itu, agar mau mewariskannya pada salah seorang di antara kalian! Itu bila kalian tidak ingin melarat seumur-umur."</p><p>(7) "Jaga mulutmu, kau bisa mati berdiri sepulang dari sini. Enyahlah! Itu kalau kau masih ingin melihat matahari besok pagi," gertak Candung, anak muda kampung Lekung, penguasa lahan parkir di kota kabupaten. (8) Ia pulang menjenguk Kurai yang dikabarkan mulai sakit-sakitan.</p><p>(9) "Sekali lagi kau meremehkan Kurai, kujamin kau pulang dengan hidung disumpal kapas."<br> (Bigau, Damhuri Muhammad)</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Sifat bengis dari tokoh Candung tercermin pada kalimat nomor...', opts:['5, 6','6, 7','7, 8','8, 9','7, 9'], kunci:[4], bahas:'<b>Sesuai kunci web defantri: (E) 7, 9</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:18, passage:'<div class="passage-title">Rona Wajah (Cerpen)<br><small>Soal 18 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Sering kulihat rona wajahnya tak ada duka meski ia sudah lama berkabung. Mungkin karena itu hatinya tak lagi berkabut. Menjalani hari dengan bahagia walau keadaan seperti ini. Ia mengantar kepergianku sampai depan pintu. Aku tahu, ia selalu menaruh harap agar aku cepat dapat uang untuk upacara kematian Ambe. Letihkah Indo merawat Ambe?</p><p>Cuma tongkonan ini yang kami punya atau yang tersisa. Indo hanya istri kedua Ambe. Katanya, dulu banyak kerabat tidak setuju ketika mereka menikah dan kakak-kakak tiriku menerima dengan syarat menuntut pembagian harta sebagai ahli waris mendiang ibu mereka. Sekarang, Ambe tak memiliki harta peninggalan, bahkan buat perayaan kematiannya sendiri. Anak-anaknya terdahulu pun seperti tak peduli. Tinggallah aku dan Indo yang menanggung beban. Berat, entah sampai kapan kami mampu menahan.<br> (Ambe Masih Sakit, Emil Amir)</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'bs', tanya:'Tentukan apakah setiap pernyataan berikut Benar atau Salah , merupakan kutipan cerpen di atas.<br><small>Tentukan Benar / Salah sesuai isi teks.</small>', labels:['Benar','Salah'], statements:['Indo sudah sangat letih merawat Ambe.','Yang dimiliki Aku dan Indo hanyalah tongkonan.','Ambe tidak punya harta untuk perayaan kematiannya.','Sebenarnys Ambe dulu kaya, tetapi ank-anaknya serakah.','Aku ingin segera mendapatkan uang untuk membiayai upacara kematian Ambe.'], kunci:['Salah','Benar','Benar','Salah','Benar'], bahas:'<b>Sesuai kunci web defantri.</b> Kunci: Salah | Benar | Benar | Salah | Benar.'},
{id:19, passage:'<div class="passage-title">Puisi Cintaku Jauh di Pulau<br><small>Soal 19 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Cintaku Jauh Di Pulau Cintaku jauh di pulau,<br> gadis manis, sekarang iseng sendiri.</p><p>Perahu melancar, bulan memancar,<br> di leher kukalungkan ole-ole buat si pacar.<br> angin membantu, laut terang, tapi terasa<br> aku tidak \'kan sampai padanya.</p><p>Di air yang tenang, di angin mendayu,<br> di perasaan penghabisan segala melaju<br> Ajal bertakhta, sambil berkata:<br> "Tujukan perahu ke pangkuanku saja."</p><p>Amboi! Jalan sudah bertahun kutempuh!<br> Perahu yang bersama \'kan merapuh!<br> Mengapa Ajal memanggil dulu<br> Sebelum sempat berpeluk dengan cintaku?!</p><p>Manisku jauh di pulau,<br> Kalau \'ku mati, dia mati iseng sendiri.</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Tema utama dari puisi di atas adalah...', opts:['kasih tak sampai','kasih yang tulus','frustasi karena cinta','cinta yang sangat dalam','kepasrahan dalam cinta'], kunci:[0], bahas:'<b>Sesuai kunci web defantri: (A) kasih tak sampai</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:20, passage:'<div class="passage-title">Dialog Agra (Gambar)<br><small>Soal 20 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>[Gambar/dialog pada soal ini tidak terlampir dalam teks HTML. Lihat sumber asli defantri.com untuk gambar lengkap.]</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Berdasarkan dialog di atas dapat disimpulkan bahwa watak Agra adalah...', opts:['ramah pada gurunya','lucu dan suka menghibur','suka mempermainkan guru','baik hati pada teman-temannya','suka melakukan perundungan'], kunci:[4], bahas:'<b>Sesuai kunci web defantri: (E) suka melakukan perundungan</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:21, passage:'<div class="passage-title">Sinta dan Adi (Gambar)<br><small>Soal 21 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>[Gambar/dialog pada soal ini tidak terlampir dalam teks HTML. Lihat sumber asli defantri.com untuk gambar lengkap.]</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'bs', tanya:'Tentukan apakah setiap pernyataan berikut Benar atau Salah , merupakan konsekuensi yang harus ditanggung Sinta atas keputusannya.<br><small>Tentukan Benar / Salah sesuai isi teks.</small>', labels:['Benar','Salah'], statements:['meninggalkan desanya.','mengubur mimpinya untuk hidup bersama dengan Adi.','harus mampu menjaga diri sendiri.','batal menikah dengan Adi.','harus menyesuaikan dengan kehidupan masyarakat kota.'], kunci:['Benar','Salah','Benar','Salah','Benar'], bahas:'<b>Sesuai kunci web defantri.</b> Kunci: Benar | Salah | Benar | Salah | Benar.'},
{id:22, passage:'<div class="passage-title">Tarian Bangau dan Siti<br><small>Soal 22 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Tak ada keindahan seanggun tarian burung bangau yang sedang bercumbu. Dan Siti menatap takjub beratus-ratus pasangan bangau yang sedang berkencan itu. Burung-burung itu serempak mencericitkan kicau mirip tangisan paling pedih yang memekakkan telinga tetapi pada saat sama mereka bergerak mirip penari keraton. Mereka mengayunkan sayap dalam gerak yang kadang-kadang lamban, kadang-kadang cepat, kadang-kadang ritmis, kadang-kadang sembarangan. Mereka juga melompat, berlari, melompat lagi, dan berlari lagi. Dan yang membuat lelaki kencur 10 tahun itu lebih takjub, bangau-bangau itu berdiri tegap saling menatap dengan paruh menusuk ke langit. Ia tak tahu kenapa sang pejantan hanya mengeluarkan suara sekali dan para betina berkali-kali.</p><p>Itulah pemandangan yang berulang-ulang dilihat oleh Siti dan berulang-ulang pula membuat dia kehilangan cara untuk mengungkapkan ketakjuban. Akan tetapi, hari itu, pada Oktober 1965 saat angin laut begitu asin dan amis, burung-burung bangau itu nyaris tidak melakukan gerak apa pun. Isya sudah usai menghampiri kampung di ujung tanjung itu tetapi satwa-satwa tropis ini tetap saja membisu. Siti menduga ada ratusan ular raksasa yang menelan mereka. Dan dalam benak lelaki kencur itu hewan melata yang menjijikkan itu mula-mula menyambar sayap, lalu menghajar, dan meng-kremus kepala-kepala mereka.</p><p>Karena penasaran, Siti yang dari masjid hendak bergegas ke rumah, tiba-tiba berbalik arah menuju ke tanah lapang yang dikelilingi hutan bakau tak jauh dari makam yang dikeramatkan. Dari tanah lapang itulah, ia akan bisa dengan seksama melihat segala yang terjadi pada burung-burung bangau yang berkerumun di tanah becek, di antara pohonpohon bakau. Tentu jika memang benar ular-ular raksasa itu melahap secara sembarangan burung-burung bangau kesayangan, dengan oncor (1) yang terus menyala Siti akan mengusir binatang-binatang menyeramkan itu.</p><p>"Kalian tak boleh menyakiti teman-temanku," kata Siti sambil mengacungacungkan oncor kepada ular-ular yang ia bayangkan sangat ganas itu.</p><p>Ternyata tidak ada yang mencurigakan. Tak ada ular-ular raksasa yang berkeliaran. Tak ada satu pun bangkai bangau yang berdarah-darah. Ratusan bangau itu justru nyekukruk (2) meskipun tetap mencericitkan suara-suara kacau yang memekakkan.<br> "Mengapa kalian tak menari?"</p><p>Tak ada jawaban. Siti sama sekali tidak tahu sesungguhnya alam punya cara merahasiakan segala peristiwa buruk kepada anak-anak. Bangau-bangau dan pohon-pohon bakau itu malam itu seakan-akan menjadi benteng kokoh yang tidak bisa ditembus oleh mata lemah Siti. Saking rapat mereka menyembunyikan segala hal yang terjadi di balik gerumbul bakau dan benteng bangau, Siti hanya melihat semacam dinding tebal hitam memisahkan tanah lapang dari ujung tanjung. Akibat air menyurut ujung tanjung itu berubah menjadi alun-alun penuh pasir, selongsong siput, dan aneka kerang.</p><p>"Ayolah, mengapa kalian tidak menari?" teriak Siti sekali lagi.<br> Tetap tak ada jawaban. Tetap hanya angin amis yang menampar-nampar tubuh Siti yang terlalu rapuh untuk berhadapan dengan amuk malam.<br> (Burung Api Siti, Triyanto Tiwikromo)</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'bs', tanya:'Tentukan apakah setiap pernyataan berikut Benar atau Salah , merupakan hubungan peristiwa yang tersirat pada teks di atas.<br><small>Tentukan Benar / Salah sesuai isi teks.</small>', labels:['Benar','Salah'], statements:['Siti marah karena ular yang memangsa burung-burung bangau.','Siti tetap tidak mengerti mengapa burung bangau tidak menari.','Siti yang terbiasa melihat bangau menari penasaran dengan keadaan yang membuat bangau yang tidak menari.'], kunci:['Salah','Benar','Benar'], bahas:'<b>Sesuai kunci web defantri.</b> Kunci: Salah | Benar | Benar.'},
{id:23, passage:'<div class="passage-title">Cis dan Cas<br><small>Soal 23 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Hening lagi. Cis berdiri bagai onggok kayu. Membiarkan kepalanya merunduk dan waktu terus mengalir.</p><p>"Cis," Munar mengingatkan.</p><p>Cis bergeming. Dua tiga kali tetap begitu.</p><p>Munar membawa langkahnya mendekati Cis. Menyisi. Cis jadi tampak imut karena ujung rambut bagian atas kepalanya tak lebih tinggi dari punggung Munar. Dia mendehem, seolah membuang sumbat dalam lubang rongga kerongkongannya.</p><p>"Baiklah," Munar memulai. "Izinkan aku yang bicara, Cis." Memutar leher ke Cis yang masih merunduk. Lalu, beralih menebar pandang kepada tamu-tamu yang masih duduk diam di hadapannya.</p><p>"Cas," kata Munar menyebut nama Casmidi, "Sikapnya aneh, benar-benar aneh, tidak kita bisa mengerti, semenjak seminggu yang lalu." Berhenti sesaat oleh suara batuk tertahan salah satu undangan. Pada kepala orang-orang itu berseliweran sosok Cas. Tinggi sekitar 170 cm. Kepala agak lonjong. Bibir kebiruan. Mata cekung dengan alis hitam pekat. Dahinya lebar. Sebagian rambut memutih. Warna kulit putih pucat.</p><p>Munar kemudian mengurai keanehan-keanehan Cas seperti yang sebagian besar sebenarnya juga sudah diketahui warga.</p><p>"…dua minggu lalu Cas menguras tabungannya. Membagi-bagikannya kepada orang-orang yang dia anggap sangat membutuhkan bantuan dan hanya menyisakan sedikit untuk kebutuhan keluarganya untuk sekali makan…"</p><p>Diam sejenak. Berdehem satu kali. Lalu melanjutkan:</p><p>"…Cas sekarang selalu keluar dari rumahnya pada pagi hari. Menjelang siang dia pulang dan memberi uang atau apa pun yang didapatkannya untuk makan keluarganya siang itu. Untuk makan keluarganya di sore hari, Cas berangkat lagi dari rumahnya entah ke mana dan baru kembali menjelang sore untuk memberikan pendapatannya kepada keluarganya…"</p><p>Munar mengatur sengalnya.</p><p>"…seminggu lalu, Cas menjual barang-barang di rumahnya. Televisi, radio, sepeda… Cas melepas lima burung perkututnya, melepasnya begitu saja. Burung-burung klangenan itu beterbangan tak karuan. Ada yang kembali ditangkap tetangga. Cas diam saja. Membiarkan. Seperti tidak tahu…"</p><p>Munar kembali mengatur napas. Cis terduduk serupa patung. Cus di kursinya menatap ruang kosong. Tanpa reaksi.</p><p>"…Cas juga membagi-bagikan pakaian-pakaiannya dan pakaian-pakaian anak dan istrinya yang masih layak pakai. Menyisakan satu dua potong belaka. Isi rumahnya hampir melompong…"</p><p>Munar mendongak seperti memikirkan sesuatu. Lalu katanya lagi:</p><p>"…Cis kemarin mendatangi saya. Menangis terisak. Katanya Cas sudah menjual sepetak sawahnya. Uangnya tidak dibawa pulang. Diserahkan kepada amil masjid. Amal jariah katanya. Selain tanah dan rumah yang kini ditempati, Cas tak punya apa-apa lagi." "…itu mungkin baru sebagian yang kita sama-sama tahu. Kita belum tahu apa saja yang sudah dilakukan Cas, laku aneh yang tidak kita mengerti…"</p><p>Munar terdiam sesaat. Seperti menunggu reaksi 15-an orang yang duduk di hadapannya tanpa suara. Karena tidak ada yang berani membuka suara, Munar melanjutkan:</p><p>"…ada yang bertanya?" dia bertanya. "Ada yang bertanya mengapa Cas melakukan hal itu? Tidak ada. Kalau begitu, baiklah saya jelaskan saja garis besarnya." "Bagi Cas," Munar memulai lagi, "Manusia bisa mati kapan saja. Bisa sekarang, satu menit kemudian, satu jam kemudian, satu hari kemudian, satu minggu, satu bulan, satu tahun… kapan saja. Karena itu, Cas merasa ndak perlu punya tabungan atau simpanan makanan atau uang bahkan untuk besok pagi, untuk sore hari, untuk besok, minggu depan, bulan depan, atau tahun depan. Semua simpanan kita, uang, makanan, pakaian, kendaraan, rumah, tanah, tidak ada artinya bila kita tiba-tiba semaput dan mati. Semuanya akan kita tinggalkan. Yang kita bawa cuma raga kita dan amal kita…"</p><p>Mulai terdengar bisik-bisik. Seperti suara lalat. Munar membiarkan.</p><p>"Coba tenang," Munar memulai lagi. "Cis menangis kepada saya, meminta saya mencarikannya jalan keluar. Apa sebaiknya yang harus dia lakukan? Saya memberinya beberapa pilihan. Pertama ikut saja apa kata dan laku Cas yang penting setiap hari bisa makan, bisa pakai baju, tidak kelaparan, ndak kedinginan karena Cis mengaku masih cinta sama Cas. Yang kedua, ini bukan anjuran, ini cuma pilihan jalan keluar, yaitu bercerai saja dari Cas. Berpisah. Memilih jalan hidup masing-masing.<br> (Cas Cis Cus, Aba Mardjani)</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'bs', tanya:'Tentukan apakah setiap reaksi berikut yang paling Mungkin atau Tidak Mungkin terjadi pada tokoh Cis terhadap masalah tersebut.<br><small>Tentukan Mungkin / Tidak Mungkin sesuai isi teks.</small>', labels:['Mungkin','Tidak Mungkin'], statements:['Cis tetap Bersama Cas karena ia sangat mencintainya.','Cis bercerai dengan Cas karena tidak tahan hidup melarat.','Cis marah karena Munar menyuruhnya bercerai dengan Cas.','Cis tetap Bersama Cas karena bersamanya ia masih ttap bisa hidup.','Cis tetap Bersama Cas karena apa yang dilakukan Cas tidak sepenuhnya salah.'], kunci:['Mungkin','Tidak Mungkin','Tidak Mungkin','Mungkin','Mungkin'], bahas:'<b>Sesuai kunci web defantri.</b> Kunci: Mungkin | Tidak Mungkin | Tidak Mungkin | Mungkin | Mungkin.'},
{id:24, passage:'<div class="passage-title">Dua Puisi Sapardi<br><small>Soal 24 — full teks dari web</small></div><p>Bacalah puisi berikut dengan saksama!</p><p>Akulah Si Telaga <br> (Sapardi Djoko Damono)<br>akulah si telaga:<br>berlayarlah di atasnya;<br>berlayarlah menyibakkan riak-riak kecil<br>yang menggerakkan bunga-bunga padma;<br>berlayarlah sambil memandang harumnya cahaya;<br>sesampai di seberang sana, tinggalkan begitu saja<br>perahumu biar aku yang menjaganya.</p><p>Hujan Bulan Juni<br> Sapardi Djoko Damono<br> tak ada yang lebih tabah<br> dari hujan bulan Juni<br> dirahasiakannya rintik rindunya<br> kepada pohon berbunga itu<br> tak ada yang lebih bijak<br> dari hujan bulan Juni<br> dihapusnya jejak-jejak kakinya<br> yang ragu-ragu di jalan itu<br> tak ada yang lebih arif<br> dari hujan bulan Juni<br> dibiarkannya yang tak terucapkan<br> diserap akar pohon bunga itu</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Perbandingan majas kedua puisi di atas adalah...', opts:['Puisi 1 didominasi dengan majas hiperbola, puisi 2 didominasi dengan majas simile','Puisi 1 didominasi majas majas paralelisme, puisi kedua didominasi dengan majas metafora','Puisi 1 didominasi dengan majas metafora, puisi 2 dengan majas personifikasi dan repetisi','Puisi 1 didominasi dengan majas simile, puisi kedua didominasi dengan majas personifikasi','Puisi 1 didominasi dengan majas metafora, puisi kedua dengan majas personifikasi'], kunci:[2], bahas:'<b>Sesuai kunci web defantri: (C) Puisi 1 didominasi dengan majas metafora, puisi 2 dengan majas personifikasi dan repetisi</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:25, passage:'<div class="passage-title">Sahasika dan Paman<br><small>Soal 25 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>"Paman, bagi saya, pujian yang datangnya bisa dari siapa saja bukan ukuran kalau saya benar-benar memiliki kehebatan seperti yang disangkakan orang lain. Mereka bisa salah memperkirakan seberapa tinggi kemampuan saya. Saya mengatakan ini berdasarkan bukti nyata Paman."</p><p>"Apa bukti nyata yang kamu maksudkan, Sahasika?"</p><p>"Kegagalan saya mencegah terjadinya perang antara Wilwatikta dan Tuban merupakan bukti nyata bahwa saya bukan orang hebat. Kemudian terjadinya pembunuhan terhadap ksatria utama Mahesa Sora yang tidak bisa saya cegah juga. Dari kedua peristiwa itu saja menunjukkan bahwa saya tidak mempunyai kemampuan apa-apa. Makanya saya paling merasa malu kalau dipuji-puji sebagai kesatria hebat.</p><p>"Pernyataanmu bukan bukti nyata kalau kamu gagal mencegah dua peristiwa besar yang membuat rakyat Wilwatikta makin lemah. Kamu hanya rakyat jelata. Kamu bukan raja, bukan punggawa, bukan senopati, dan bukan prajurit Wilwatikta. Apa dayamu sebagai rakyat jelata untuk mencegah peristiwa yang pasti tidak bisa dicegah oleh siapa saja, termasuk Sinuwun Prabu waktu itu. Sebentar…, tiba-tiba aku ingat kata seorang sahabat yang tinggal di Wilwatikta dan mengenal dekat mendiang Adipati Ranggalawe."</p><p>"Apa kata sahabat Paman itu?"</p><p>"Begini…. Kata sahabatku itu, dulu Dyah Wijaya pernah menjanjikan kedudukan mahapatih kepada Ranggalawe kalau pendirian Wilwatikta selesai. Namun kenyataannya, saat Wiwatikta berdiri dan Dyah Wijaya menobatkan dirinya sebagai raja, yang diangkat sebagai mahapatih adalah Nambi. Rasa kecewa Adipati Tuban itu dilampiaskan drngan sikap menentang keputusan Dyah Wijaya secara keras. Waktu itu Adipati Ranggalawe tidak akan bergabung dengan Wilwatikta kalau Mahapatih Hamengkubumi Nambi tidak diganti. <br> (Mahapatih Nambi, Gesta Bayuadhy)</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Konflik tokoh Sahasika yang sering terjadi dalam kehidupan sehari-hari adalah...', opts:['Orang sering mengingkari janji ketika berada di puncak kesuksesan.','Orang merasa dirinya hebat karena banyak yang memuji.','Orang merasa rendah diri ketika mengalami kegagalan.','Orang merasa bijaksana jika mengetahui banyak hal.','Orang akan membalas dendam jika dikecewakan.'], kunci:[2], bahas:'<b>Sesuai kunci web defantri: (C) Orang merasa rendah diri ketika mengalami kegagalan.</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:26, passage:'<div class="passage-title">Halayuda dan Pundak Rajung<br><small>Soal 26 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>"Mengapa Halayuda bisa mempengaruhi segala kebijakan, Sinuwun Prabu?" tanya Pundak Rajung.</p><p>"Karena dia pandai mengambil hati Sinuwun Prabu. Setiap peikirannya bisa dengan eluasa dia tanamkan ke benak siapa saja. Itu memang kehebatan Halayuda. Saya sudah cukup mengenal watak aslinya. Dia sangat hebat dengan memainkan lidahnya. Dia pandai bersilat lidah. Entah itu secara halus ataupun secara kasar."</p><p>"Apakah hanya itu kemampuannya?"</p><p>"Tentu saja tidak, Paman. Halayuda juga memiliki kesaktian tingkat tinggi yang tidak mudah dikalahkan siapa pun. Saya yang dianggap paling hebat di Paguron Candhini, belum tentu bisa menandingi Halayuda. Bahkan kalau suatu saat saya bertarung melawan Halayuda, bisa saja saya kalah dan mati di tangannya."</p><p>"Kamu boleh berendah hati dan berendah diri seperti itu, Sahasika. Hanya saja, menurut kabar yang beredar, Halayuda juga keder dan ciut nyali setiap mendengar namamu. Tidak heran dia mau membunuhmu dengan berbagai cara. Kamu hampir saja mati di jurang saat pulang dari Tuban. Untung saja kamu masih terselamatkan."</p><p>"Dari mana Paman tahu kalau Halayuda minder sama Sahasika? Jangan-jangan Paman sedang mimpi sekarang! Kalau yang berbicara Munding Bayong, jangan langsung dipercaya Paman! Munding Bayong itu kadang-kadang terlalu membesar-besarkan kehebatan orang lain."</p><p>"Selain Munding Bayong, ada beberapa temanku yang sering bertandang ke ibu kota Wilwatikta. Katanya, nama Sahasika tidak bisa dianggap enteng di kalangan para punggawa, senopati, prajurit, dan kalangan rakyat pada umumnya. Bahkan semasa mendiang Sinuwun Prabu Dyah Wijaya, beberapa kali beliau memuji kehebatanmu dalam beberapa pertempuran agung di istana Wilwatikta. <br> (Mahapatih Nambi, Gesta Bayuadhy)</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'bs', tanya:'Tentukan apakah setiap pernyataan berikut Benar atau Salah , merupakan sikap tokoh Sahasika yang dapat dijadikan teladan.<br><small>Tentukan Benar / Salah sesuai isi teks.</small>', labels:['Benar','Salah'], statements:['rendah hati.','tidak memandang rendah orang lain.','rendah diri.','suka membantah.','tidak sombong karena dipuji.'], kunci:['Benar','Benar','Salah','Salah','Benar'], bahas:'<b>Sesuai kunci web defantri.</b> Kunci: Benar | Benar | Salah | Salah | Benar.'},
{id:27, passage:'<div class="passage-title">Kolam Gurami<br><small>Soal 27 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Dia lalu mengajak saya ke halaman belakang di mana kami pernah bersama-sama membuat kolam gurami. Kolam itu sudah tiada, diuruk sejak lama berganti menjadi sebuah gudang tempatnya kini berkreasi membuat kerajinan dari bambu. Hasil dari tangan terampilnya itu ditambah pembagian keuntungan sawah garapan milik orang lainlah yang menghidupi istri dan dua anaknya hingga kini.</p><p>Ayah dan ibunya sudah meninggal, tapi sebuah masalah berat kini menjeratnya. Dia bercerita, sertifikat rumah dan tanah peninggalan orangtua justru tergadaikan. "Kakakku itu, masih sama sifatnya seperti kau mengenalnya dulu. Hanya kini, semakin tua dia semakin tidak tahu diri."</p><p>"Ulahnya?" Dia mengangguk.</p><p>"Kau tahu, rumah dan tanah yang tidak seberapa luas ini adalah milik kami paling berharga. Tapi aku tidak kuasa untuk menolak kemauannya mencari pinjaman modal usaha dengan mengagunkan semuanya. Aku percaya padanya, peduli padanya. Tapi, dia tidak memiliki rasa yang sama terhadapku. Dia mengkhianati kepercayaanku. Usahanya kandas dan kini beban berat ada di pundakku." Terbayang sosok kakaknya dahulu, seorang remaja putus sekolah yang selalu menyusahkan orangtua dengan kenakalan-kenakalannya. Kini setelah beranjak tua, masih pula dia menyusahkan adik satu-satunya.</p><p>"Kami akan bertahan," katanya tersenyum saat melepas saya setelah hari beranjak sore. Ada kesungguhan dalam suaranya.</p><p>Sepanjang perjalanan pulang, pikiran saya tidak pernah lepas dari sahabat saya yang baik itu. Saya malu. Sebagai sahabat, saya merasa belum pernah berbuat baik padanya. Tidak pula yakin akan mampu melakukan seperti yang dilakukannya untuk menolong saya di malam itu. Dia telah membuktikan bahwa keberanian dan rasa tanggung jawab yang besar bisa timbul dari sebuah persahabatan yang tulus.</p><p>Mata saya kemudian melirik seragam dinas yang tersampir di sandaran jok belakang. Sebagai jaksa yang baru saja menangani satu kasus perdata, seragam itu belum bisa membuat saya bangga. Nilainya jelas jauh lebih kecil dibanding nilai persahabatan yang saya dapatkan dari sebuah seragam coklat Pramuka. Tapi dia tidak tahu, dengan seragam dinas itu, sayalah yang akan mengeksekusi pengosongan tanah dan rumahnya. <br> (Seragam, Aris Kurniawan Basuki)</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Berdasarkan teks di atas, dapat disimpulkan bahwa...', opts:['Konflik yang terdapat dalam teks sangat seru sehingga pembaca mejadi berdebardebar.','Teks tersebut menjelaskan alasan tokoh saya melakukan pengosongan rumah.','Uraian peristiwa dalam teks menunjukkan kalau tokoh saya adalah misterius.','Uraian peristiwa dalam teks menunjukkan bahwa tokoh saya adalah orang yang tidak tahu membalas budi.','Teks yang berisi curhatan tentang kondisi tokoh sahabat bisa menentukan konflik yang dialami tokoh saya.'], kunci:[3], bahas:'<b>Sesuai kunci web defantri: (D) Uraian peristiwa dalam teks menunjukkan bahwa tokoh saya adalah orang yang tidak tahu membalas budi.</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:28, passage:'<div class="passage-title">Tokoh Laila<br><small>Soal 28 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Kuamati wajah Laila sekali lagi, balik ke kursi, menonton tivi. Tidak ada yang patut. Pisah-cerai artis. Heboh, aneh, bagai pasangan hidup hanya mainan. Atau baju, sepatu, dapat kau ganti kapan mau. Tapi aku terus menonton. Siapa tahu Man ada lagi di tivi. Atau telepon berbunyi. Lalu Armin, Arni, berkabar mengenai abang mereka.</p><p>Di saluran lain film kartun, masak-memasak. Ah. Masakan Laila tentu mampu bersaing kalau tak lebih sedap. Tiga puluh delapan tahun seleraku dimanja, asam urat kolesterol pun tak singgah. Cuma umur, terus menjulur; meretas garis dekat ke batas. "Oh, hebat ini! Sedap. Luar biasa!" Semua teman pun memuji tiap kali kujamu makan di rumah, dulu, sebelum pensiun–dan jumlah sahabat juga masih lengkap.</p><p>Macam mana tak hebat luar biasa. Dari kecil Laila suka dan terlatih memasak. Bakatnya turun dari nenek serta ibunya, dia asah tiap hari. "Pokoknya, masakan Laila itu hm!" puji kakak-kakak perempuan ketika aku disuruh pulang dengan alasan ibu sakit, tahunya mau dijodohkan. Umurku 30 waktu itu. Keluarga cemas aku tidak dapat jodoh di rantau orang, bujang lapuk seumur hidup bak kayu dilahap rayap.</p><p>Kepalang basah, kutantang mereka, para kakak. "Hm, itu apa?"<br> "Macam mana kau ini. Variatif, inovatif, sedap!"<br> "Dibanding rumah makan Famili Andalas?"<br> "Jangan mencemooh kau. Ibu saja takjub, amat berharap Laila jadi menantu."</p><p>Ayah ikut-ikutan. Saat kami berdua, diajaknya aku bicara, istilah dia, "obrolan antarlelaki". Bahwa cinta seorang lelaki diawali dari tengah, dari perut, naik ke dada, baru turun ke bawah. Tak sebaliknya: dari dada atau hati dulu macam anak baru baliq. Apalagi dari bagian tubuh bawah.</p><p>"Mengapa begitu?" tanyaku.</p><p>"Karena perut itu pusat, keseimbangan. Penyakit asalnya dari perut. Pun nafsu, keserakahan. Karena itu, perut harus kita jaga dengan makanan sehat sekaligus sedap. Karena itu lelaki memerlukan perempuan yang campin memasak, cerdas, baik, selain cantik.</p><p>Ya, seperti ibumu. Juga, Laila."<br> "Memang kalau dari atas dulu, dari hati macam anak baru baliq, kenapa?" “Cinta kau mudah guyah," ujar ayah. "Dada itu emosi, perasaan. Dan perasaan rentan terhadap cuaca, mudah berubah."</p><p>"Kalau dari bawah dulu?"<br> Tiba-tiba ayah melotot. "Dungunya!" dia bilang. "Dari tadi aku kias-kias tidak paham. Bejat, tahu. Juga tolol. Kau bakalan terjebak menolak kodrat sebagai manusia, mendekat ke hewan. Kau akan terus mencari, tak puas-puas, bak minum air laut!" "Oh. Eh, pernah Ayah minum air laut? Maksudku, waktu muda."</p><p>"Mana sudi aku!" Ayah kembali membelalak. "Kau? Mau? Sudah?"<br> "Ah, aku tak tahan lelah, Yah," kubilang.<br> Muka ayah cerah. "Makanya, lekas kau belajar kenal dengan Laila!" katanya. Kemudian aku tahu, memang dia paling bersemangat menjodohkan aku dengan Laila. <br> (Menjaga Perut, Adek Alwi)</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Berdasarkan teks di atas, tokoh Laila digambarkan sebagai orang yang...', opts:['pandai memasak, baik, cerdas','pandai memasak dan penurut','pandai memasak tapi pemalas','pandai memasak dan rendah hati','pandai memasak dan memanjakan suami'], kunci:[0], bahas:'<b>Sesuai kunci web defantri: (A) pandai memasak, baik, cerdas</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:29, passage:'<div class="passage-title">Buruh Tani<br><small>Soal 29 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Hampir kebanyakan warga di kampung kami ini adalah buruh tani. Hanya beberapa orang yang memiliki sawah, dapat dihitung dengan ingatan. Setiap hari kami harus menumpahkan tenaga di ladang. Dapat dibayangkan keletihan kami bila malam menjelang. Tentulah kehadiran Darko membuat kampung kami lebih menggeliat, makin bergairah.</p><p>Setiap malam, dengan membawa minyak urut, dia menyusur dari gang ke gang kampung guna menjemput pelanggan. Kakinya bagai digerakkan tanah, dia begitu saja melangkah tanpa bantuan tongkat. Tidak pernah menabrak pohon atau jatuh ke sungai. Memang, tangannya kerap meraba-raba udara ketika melangkah, seperti sedang menatap keadaan. Barangkali penglihatan Darko terletak di telapak tangannya.</p><p>Dia akan berhenti ketika seseorang memanggilnya. Melayani pelanggannya dengan tulus dan sama rata, tanpa pernah memandang suatu apa pun. Serta yang membuat kami semakin hormat, tidak pernah sekali pun dia mematok harga. Dengan biaya murah, bahkan terkadang hanya dengan mengganti sepiring nasi dan teh panas, kami bisa mendapatkan kenikmatan pijat yang tiada tara. Kami menikmati bagaimana tangannya menekan lembut tiap jengkal tubuh kami. Kami merasakan urat syaraf kami yang perlahan melepaskan kepenatan bagai menemukan kesegaran baru setelah seharian ditimpa kelelahan. Pantaslah bila terkadang ada pelanggan yang tertidur saat sedang dipijat.</p><p>Selain itu, Darko memiliki pembawaan sikap yang ramah, tidak mengherankan bila orang- orang kampung segera merasa akrab dengan dirinya. Dia suka pula menceritakan kisah lucu di sela pijatannya. Meskipun begitu, kami tetap tidak tahu asal usulnya dengan jelas. Bila kami menanyakannya, dia selalu mengatakan bahwa dirinya berasal dari kampung yang jauh di kaki gunung.</p><p>Kemudian kami ketahui, bila malam hampir tandas, Darko kembali ke tempat pemakaman di ujung kampung. Di antara sawah-sawah melintang. Sebuah tempat pemakaman yang muram, menegaskan keterasingan. Di sana terdapat sebuah gubuk yang menyimpan keranda, gentong, serta peralatan penguburan lain yang tentu saja kotor sebab hanya diperlukan bila ada warga meninggal. Di keranda itulah Darko tidur, memimpikan apa saja. Dia selalu mensyukuri mimpi, meskipun percaya mimpi tak akan mengubah apaapa. Sudah berhari-hari dia tinggal di sana. Tak dapat kami bayangkan bagaimana aroma mayit yang membubung ke udara lewat tengah malam, menggenang di dadanya, menyesakkan pernapasan.<br> (Tukang Pijat Keliling, Sulung Pemanggih)</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'bs', tanya:'Tentukan apakah setiap pernyataan berikut Benar atau Salah sesuai dengan kutipan teks!<br><small>Tentukan Benar / Salah sesuai isi teks.</small>', labels:['Benar','Salah'], statements:['Darko melayani pelanggannya dengan tulus dan sama rata, tanpa pernah memandang suatu apa pun.','Darko memijat dengan patokan biaya yang sangat murah.','Bila malam hamper tandas Darko ke pemakaman ujung kampung untuk tidur di keranda.'], kunci:['Benar','Salah','Benar'], bahas:'<b>Sesuai kunci web defantri.</b> Kunci: Benar | Salah | Benar.'},
{id:30, passage:'<div class="passage-title">Aku dan Dia<br><small>Soal 30 — full teks dari web</small></div><p>Bacalah teks berikut dengan saksama!</p><p>Bagaimana aku bertemu dengan dia?<br> Ah ya, ini perlu dijelaskan lebih dulu.</p><p>Malam yang dingin di atas bus kota. Dua minggu sebelum dia mengajak kami ke toko buku. Hujan turun deras di sepanjang jalan. Membungkus kota kami. Memaksaku mengeluarkan suara lebih kencang. Adikku memukul kencrengannya dengan lemah. Dede sudah lelah. Sejak pagi dia tidak henti bernyanyi. Aku membujuknya tadi sebelum naik ke bus itu untuk lebih bersemangat. Tetapi adikku sudah lelah. Lihatlah! Dia sudah banyak menguap. Maka aku membiarkannya saja.</p><p>Hari ini kami sedang sial. Sebenarnya hingga sore tadi, setelah naik dari satu bus ke bus yang lain, dari satu metromini ke metromini yang lain, aku dan Dede sudah dapat kurang-lebih sembilan belas ribu. Jumlah yang banyak. Tetapi di terminal tadi, ada kakakkakak yang mabuk memaksa meminta uang. Dia mencengkeram leher Dede. Aku bisa saja berteriak. Tetapi cengkeramannya keras sekali, membuat muka Dede pucat pasi tak bisa mengeluarkan suara aduh lagi. Mengerikan. Terpaksa kuberikan semua uang yang ada di kantong kiriku. Itu separuh penghasilan mengamen kami seharian, sepuluh ribu.</p><p>Malam sudah larut. Hampir jam delapan. Aku memutuskan untuk pulang, meskipun dengan uang seadanya. Ibu tidak pernah mengomel berapa pun uang yang kami bawa pulang. Jadi kami naik bus jurusan ini. Bus kota penuh oleh orang-orang yang baru pulang kerja. Sebenarnya itu kabar baik buat setiap pengamen, sayangnya mereka sudah banyak yang tertidur kelelahan. Jadi tak terlalu memperhatikan.</p><p>Aku bernyanyi lebih keras.<br> Sudah empat lagu, bus hampir tiba di tujuan akhirnya. Cukup. Aku mengeluarkan kantong plastik !ecek bekas permen. Mengedarkannya dari depan ke belakang. Berharap kebaikan sedang bersemayam di hati orang-orang yang sedang kelelahan tersebut. Adikku mengintil mengikuti. Kencrengan tutup botol masuk kantong celana kumuh. <br> (Daun yang Jatuh Tak Pernah Membenci Angin, Tere Liye)</p><p><small>Sumber: defantri.com Model D</small></p>', tipe:'pg', tanya:'Berdasarkan teks di atas, bagaimana hubungan antara konflik cerita dan respons emosional yang dialami Aku?...', opts:['Aku merasa terpukul orang-orang dalam bus tidak mau berbagi rezeki denagn memberikan uang receh.','Aku bernyanyi lebih keras agar orang-orang dalam bus terbangun.','Aku merasa ketakutan dan terpaksa menyerahkan separuh hasil mengamen hari itu.','Aku terpaksa melanjutkan mengamen walaupun hari sudah larut malam.','Aku kecewa karena orang-orang di bus banyak yang tidur.'], kunci:[2], bahas:'<b>Sesuai kunci web defantri: (C) Aku merasa ketakutan dan terpaksa menyerahkan separuh hasil mengamen hari itu.</b> Difetch langsung dari atribut value=correct pada halaman.'}
];

let cur=0, answers={}, hasil={}, ragu={};
function setFont(px){document.documentElement.style.setProperty('--soal-font',px+'px')}
let sisa=4050; setInterval(()=>{sisa=Math.max(0,sisa-1);let h=String(Math.floor(sisa/3600)).padStart(2,'0'),m=String(Math.floor(sisa%3600/60)).padStart(2,'0'),s=String(sisa%60).padStart(2,'0');document.getElementById('timer').textContent=h+':'+m+':'+s},1000);

function render(){
const q=SOAL[cur];
document.getElementById('nomor').textContent='Soal nomor '+(cur+1);
document.getElementById('teks').innerHTML=q.passage;
document.getElementById('prog').textContent=(cur+1)+' / '+SOAL.length;
let h='<p><b>'+q.tanya+'</b></p>';
if(q.tipe==='pg'){
q.opts.forEach((o,i)=>{const c=answers[q.id]===i?'checked':'';h+='<label class="opt" id="opt-'+i+'"><input type="radio" name="q'+q.id+'" '+(c)+' onclick="jawab('+i+')"> <span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>'});
}else if(q.tipe==='cek'){
q.opts.forEach((o,i)=>{const c=(answers[q.id]||[]).includes(i)?'checked':'';h+='<label class="opt" id="opt-'+i+'"><input type="checkbox" '+(c)+' onclick="jawabCek('+i+')"> <span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>'});
h+='<p style="font-size:13px;color:#666">Bisa pilih lebih dari satu.</p>';
}else if(q.tipe==='bs'){
h+='<table class="bs"><tr><th>Pernyataan</th><th>'+q.labels[0]+'</th><th>'+q.labels[1]+'</th></tr>';
q.statements.forEach((s,i)=>{const v=(answers[q.id]||{})[i];h+='<tr id="row-'+i+'"><td>'+(i+1)+'. '+s+'</td><td style="text-align:center"><input type="radio" name="bs'+i+'" '+(v===q.labels[0]?'checked':'')+' onclick="jawabBS('+i+',0)"></td><td style="text-align:center"><input type="radio" name="bs'+i+'" '+(v===q.labels[1]?'checked':'')+' onclick="jawabBS('+i+',1)"></td></tr>'});
h+='</table>';
}else if(q.tipe==='info'){
h+='<p style="color:#888">Soal ini membutuhkan gambar/opsi yang tidak terlampir. Baca pembahasan di bawah.</p><button class="btn check" onclick="periksa()">Lihat Pembahasan</button>';
}
h+='<div style="margin-top:10px;display:flex;gap:8px"><button class="btn check" onclick="periksa()">Periksa Jawaban</button><button class="btn ghost" onclick="ulangi()">Ulangi</button></div>';
h+='<div class="explain" id="expl"></div>';
document.getElementById('soal').innerHTML=h;
document.getElementById('soal').scrollTop=0;
const rb=document.getElementById('raguBtn');rb.textContent=ragu[q.id]?'☑ Ragu-ragu':'☐ Ragu-ragu';rb.style.background=ragu[q.id]?'#ff8f00':'#f7b500';
if(hasil[q.id])showHasil(false);
}
function jawab(i){answers[SOAL[cur].id]=i}
function jawabCek(i){const id=SOAL[cur].id;let a=answers[id]||[];a=a.includes(i)?a.filter(x=>x!==i):[...a,i];answers[id]=a}
function jawabBS(i,li){const q=SOAL[cur];const id=q.id;let a=answers[id]||{};a[i]=q.labels[li];answers[id]=a}
function ulangi(){const id=SOAL[cur].id;delete answers[id];delete hasil[id];render()}
function nav(d){cur=Math.min(SOAL.length-1,Math.max(0,cur+d));render()}
function toggleRagu(){const id=SOAL[cur].id;ragu[id]=!ragu[id];render()}
function arraysEqual(a,b){if(a.length!==b.length)return false;let x=[...a].sort(),y=[...b].sort();return x.every((v,i)=>v===y[i])}
function periksa(){
const q=SOAL[cur],id=q.id;let benar=false,skor='';
if(q.tipe==='pg'){const j=answers[id];if(j===undefined){alert('Pilih dulu jawabanmu!');return}benar=q.kunci.includes(j);
q.opts.forEach((_,i)=>{const el=document.getElementById('opt-'+i);if(!el)return;el.classList.remove('correct','wrong');if(q.kunci.includes(i))el.classList.add('correct');else if(i===j)el.classList.add('wrong')});
}else if(q.tipe==='cek'){const j=answers[id]||[];if(!j.length){alert('Pilih dulu minimal satu!');return}benar=arraysEqual(j,q.kunci);
q.opts.forEach((_,i)=>{const el=document.getElementById('opt-'+i);el.classList.remove('correct','wrong');if(q.kunci.includes(i))el.classList.add('correct');if(j.includes(i)&&!q.kunci.includes(i))el.classList.add('wrong')});
}else if(q.tipe==='bs'){const j=answers[id]||{};if(Object.keys(j).length<q.statements.length){alert('Isi semua pernyataan dulu!');return}
benar=q.statements.every((_,i)=>j[i]===q.kunci[i]);
q.statements.forEach((_,i)=>{const r=document.getElementById('row-'+i);r.classList.remove('row-ok','row-bad');r.classList.add(j[i]===q.kunci[i]?'row-ok':'row-bad')});
}else{benar=null}
if(benar!==null)hasil[id]=benar;
showHasil(true);
updateGrid();
}
function showHasil(scroll){
const q=SOAL[cur],id=q.id;const ex=document.getElementById('expl');if(!ex)return;
if(q.tipe==='info'){ex.innerHTML='<b class="t">ℹ️ Info:</b><br>'+q.bahas;ex.classList.add('show');return}
const ok=hasil[id];let badge=ok===undefined?'':(ok?'<span class="badge ok">✅ BENAR</span>':'<span class="badge bad">❌ SALAH</span>');
let kunciTxt='';
if(q.tipe==='pg')kunciTxt='Kunci: <b>'+String.fromCharCode(65+q.kunci[0])+'. '+q.opts[q.kunci[0]]+'</b>';
if(q.tipe==='cek')kunciTxt='Kunci: <b>'+q.kunci.map(i=>String.fromCharCode(65+i)).join(', ')+'</b>';
if(q.tipe==='bs')kunciTxt='Kunci: <b>'+q.kunci.join(' | ')+'</b>';
ex.innerHTML=badge+'<br><br>'+kunciTxt+'<br><br><b class="t">💡 Pembahasan:</b><br>'+q.bahas;
ex.classList.add('show');if(scroll)ex.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function openDaftar(){document.getElementById('modal').classList.add('show');updateGrid()}
function closeDaftar(){document.getElementById('modal').classList.remove('show')}
function updateGrid(){
const g=document.getElementById('grid');g.innerHTML='';
SOAL.forEach((q,i)=>{const d=document.createElement('div');d.className='cell';d.textContent=i+1;
if(i===cur)d.classList.add('cur');if(ragu[q.id])d.classList.add('ragu');
if(hasil[q.id]===true)d.classList.add('benar');if(hasil[q.id]===false)d.classList.add('salah');
d.onclick=()=>{cur=i;closeDaftar();render()};g.appendChild(d)});
let b=Object.values(hasil).filter(v=>v===true).length,s=Object.values(hasil).filter(v=>v===false).length;
document.getElementById('score').innerHTML='Sudah diperiksa: <b>'+(b+s)+' / '+SOAL.length+'</b> — Benar: <b style="color:green">'+b+'</b> | Salah: <b style="color:red">'+s+'</b>'+(b+s>0?'<br>Nilai (dari yang diperiksa): <b>'+Math.round(b/Math.max(1,b+s)*100)+'</b>':'');
}
function resetAll(){answers={};hasil={};ragu={};render();updateGrid()}
render();updateGrid();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nav(1);if(e.key==='ArrowLeft')nav(-1)});
</script>
</body>
</html>
